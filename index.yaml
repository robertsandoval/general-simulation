    description: 'Umbrella chart for the General Simulation & Impact-Reasoning Platform.
      Deploys Postgres (pgvector + PostGIS), Neo4j, Llama Stack, schema bootstrap,
      the FastAPI API, and the ingestion CronJob. Optional in-cluster vLLM via llm-service
      (OpenShift AI / KServe) for llm.mode=local. Inference always goes through Llama
      Stack. Two modes only:   openai — Stack → OpenAI-compatible API   local  — Stack
      → in-cluster llm-service (vLLM)  Install standalone into any namespace, or consume
      as a Helm subchart from a parent application (same release namespace as the
      parent). '
