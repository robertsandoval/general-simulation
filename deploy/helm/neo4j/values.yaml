# Values for the official neo4j/neo4j Helm chart (chart version 2026.5.0).
# Modeled on the working "neo4j" project in this cluster.
#
# deploy-neo4j in the Makefile adds --set overrides for:
# passwordFromSecret references Secret neo4j-auth (created by the umbrella chart
# from bootstrap.neo4j.password / api.neo4j.password).
#   config.server.default_advertised_address  (auto-detected route hostname)

# Keep Service/StatefulSet named "neo4j" (API/bootstrap expect host "neo4j").
fullnameOverride: neo4j
# Set true when Secret neo4j-auth is created by the umbrella chart (same release).
disableLookups: true

config:
  # Advertise Bolt on port 443 — Neo4j Browser connects via WebSocket
  # through the edge-terminated HTTPS route on that port.
  server.bolt.advertised_address: ":443"
  server.http.advertised_address: ":443"
  # server.default_advertised_address is injected by Makefile at install time.

neo4j:
  acceptLicenseAgreement: "yes"
  edition: community
  name: neo4j
  # passwordFromSecret references Secret neo4j-auth (umbrella chart template).
  passwordFromSecret: neo4j-auth

  resources:
    cpu: "2"
    memory: 4Gi

# OpenShift: use neo4j-sa (anyuid SCC) so UID/GID 7474 is allowed.
# SA + ClusterRoleBinding are created by the umbrella chart when
# openshift.neo4j.scc.enabled is true.
podSpec:
  serviceAccountName: neo4j-sa

# Disable the LoadBalancer service — access is via ClusterIP + OpenShift Route.
services:
  neo4j:
    enabled: false

volumes:
  data:
    mode: defaultStorageClass
    defaultStorageClass:
      accessModes:
        - ReadWriteOnce
      requests:
        storage: 10Gi
      # Override only if you need a non-default StorageClass:
      #   --set volumes.data.mode=dynamic \
      #   --set volumes.data.dynamic.storageClassName=<class>
