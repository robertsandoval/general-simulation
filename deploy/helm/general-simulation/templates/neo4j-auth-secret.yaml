{{- if .Values.neo4j.enabled }}
{{- $password := coalesce .Values.bootstrap.neo4j.password .Values.api.neo4j.password "" }}
{{- if not $password }}
{{- fail "bootstrap.neo4j.password or api.neo4j.password is required when neo4j.enabled (creates Secret neo4j-auth)" }}
{{- end }}
# Official neo4j/neo4j chart reads this via neo4j.passwordFromSecret (neo4j-auth).
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: general-sim
    app.kubernetes.io/component: neo4j
type: Opaque
stringData:
  NEO4J_AUTH: {{ printf "neo4j/%s" $password | quote }}
{{- end }}
