{{- if and .Values.neo4j.enabled (.Values.openshift.neo4j.scc.enabled | default false) }}
# OpenShift: Neo4j runs as UID/GID 7474 — needs anyuid SCC (see neo4j-scc-binding.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neo4j-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: general-sim
    app.kubernetes.io/component: neo4j
{{- end }}
