# Default values for the general-simulation umbrella chart.
# Works standalone (`helm install -n <ns>`) and as a subchart of a parent chart.
#
# In-cluster Service DNS uses short names (same namespace). Cross-namespace
# clients should use <service>.<namespace>.svc
# (e.g. general-sim-api.general-simulation.svc).
#
# ── LLM modes (exactly one) ───────────────────────────────────────────────────
# Defaults below are mode=openai. make deploy LLM_MODE=openai|local applies
# the matching --set overrides (see Makefile).
#
#   openai — Llama Stack → OpenAI (or any OpenAI-compatible URL)
#   local  — Llama Stack → in-cluster llm-service / vLLM (needs OpenShift AI)
#
# API and ingestion always call Llama Stack (http://llamastack:8321/v1), never
# OpenAI or vLLM directly.
#
# Secrets: never commit passwords/tokens. Pass via --set or a secrets overlay.

# OpenShift-only resources (Neo4j anyuid SCC). Disable on Kind / plain Kubernetes.
openshift:
  neo4j:
    scc:
      enabled: true

# Models registered with Llama Stack (merged into the llama-stack subchart).
# Enable exactly one provider for a given install.
#
# Provider KEY must be DNS-safe (no slashes) — it becomes the InferenceService
# and Service name (<key>-vllm). Hugging Face id goes in `id:`.
global:
  registry: quay.io/rh-ai-quickstart
  imageTag: latest
  images:
    app: general-sim-api
    postgres: general-sim-postgres
  models:
    openai:
      enabled: true
      id: gpt-4o-mini
      url: https://api.openai.com/v1
      apiToken: ""   # required for openai mode — make deploy OPENAI_API_KEY=...
    # No url — llm-service only creates an InferenceService when url is unset.
    # Llama Stack then auto-fills:
    #   http://<key>-vllm.<ns>.svc.cluster.local/v1
    deepseek-r1-distill-qwen-1-5b:
      enabled: false
      id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      apiToken: unused

# ── Postgres (always on for this platform) ────────────────────────────────────
postgres:
  enabled: true
  postgres:
    username: sim
    password: ""
    database: sim

# ── Neo4j (official neo4j/neo4j chart) ────────────────────────────────────────
# fullnameOverride keeps Service/StatefulSet named "neo4j" when this chart is
# installed as a subchart of release "general-simulation" (otherwise resources
# are named after the parent release and api.neo4j.host=neo4j never resolves).
neo4j:
  enabled: true
  # Umbrella chart creates Secret neo4j-auth; skip live-cluster lookup at template time.
  disableLookups: true
  fullnameOverride: neo4j
  config:
    server.bolt.advertised_address: ":443"
    server.http.advertised_address: ":443"
  neo4j:
    acceptLicenseAgreement: "yes"
    edition: community
    name: neo4j
    passwordFromSecret: neo4j-auth
    resources:
      cpu: "2"
      memory: 4Gi
  # OpenShift: neo4j-sa + anyuid SCC (umbrella templates when openshift.neo4j.scc.enabled).
  podSpec:
    serviceAccountName: neo4j-sa
  services:
    neo4j:
      enabled: false
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 10Gi

# ── Schema bootstrap Job ──────────────────────────────────────────────────────
bootstrap:
  enabled: true
  waitFor:
    enabled: true
    timeoutSeconds: 300
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""

# ── Llama Stack (inference + vector gateway) ──────────────────────────────────
llama-stack:
  enabled: true
  rawDeploymentMode: true
  # Uses Secret "pgvector" (created by this umbrella) pointing at our Postgres.
  pgvector:
    enabled: true

# ── Optional in-cluster vLLM (mode=local only) ────────────────────────────────
# Requires Red Hat OpenShift AI (KServe). Enabled by make deploy LLM_MODE=local.
llm-service:
  enabled: false
  device: gpu
  rawDeploymentMode: true
  secret:
    enabled: true
    hf_token: ""
  models:
    deepseek-r1-distill-qwen-1-5b:
      enabled: false
      id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      device: gpu
      resources:
        limits:
          cpu: "2"
          memory: 16Gi
        requests:
          cpu: "1"
          memory: 8Gi
      args:
        - --max-model-len
        - "8192"
        - --max-num-seqs
        - "32"
        - --gpu-memory-utilization
        - "0.85"
        - --enable-auto-tool-choice
        - --chat-template
        - /chat-templates/tool_chat_template_qwen.jinja
        - --tool-call-parser
        - hermes

# ── FastAPI API (Service name: general-sim-api, port 8000) ─────────────────────
api:
  enabled: true
  route:
    enabled: true
  adminRoute:
    enabled: true
  waitFor:
    enabled: true
    timeoutSeconds: 300
    startupFailureThreshold: 60
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""
  llm:
    # Always Llama Stack — do not point at OpenAI or vLLM directly.
    baseUrl: "http://llamastack:8321/v1"
    apiKey: "unused"
    backend: "openai"
  models:
    # Stack model id: <providerKey>/<model.id> from global.models
    generation: openai/gpt-4o-mini
    # Stack inline sentence-transformers (used for both modes)
    embedding: nomic-ai/nomic-embed-text-v1.5
    embeddingDimension: "768"
  enabledDomains: aviation,shipping

# ── Ingestion CronJob ─────────────────────────────────────────────────────────
ingestion:
  enabled: true
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""
  llm:
    baseUrl: "http://llamastack:8321/v1"
    apiKey: "unused"
    backend: "openai"
  models:
    generation: openai/gpt-4o-mini
    embedding: nomic-ai/nomic-embed-text-v1.5
    embeddingDimension: "768"
  enabledDomains: aviation,shipping
  adapterId: opensky_flights
