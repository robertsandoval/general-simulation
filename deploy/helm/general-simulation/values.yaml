# Default values for the general-simulation umbrella chart.
# Works standalone (`helm install -n <ns>`) and as a subchart of a parent chart.
#
# In-cluster Service DNS uses short names (same namespace). Cross-namespace
# clients should use <service>.<namespace>.svc
# (e.g. general-sim-api.general-simulation.svc).
#
# Secrets: never commit passwords. Pass via --set or a secrets overlay:
#   --set postgres.postgres.password=<pw>
#   --set api.postgres.password=<pw> --set api.neo4j.password=<pw>
#   --set bootstrap.postgres.password=<pw> --set bootstrap.neo4j.password=<pw>
#   --set ingestion.postgres.password=<pw> --set ingestion.neo4j.password=<pw>
# Neo4j: pre-create Secret neo4j-auth with NEO4J_AUTH=neo4j/<password>
#   (see README), or override neo4j.neo4j.passwordFromSecret / chart password.

# ── Postgres (always on for this platform) ────────────────────────────────────
postgres:
  enabled: true
  postgres:
    username: sim
    password: ""
    database: sim

# ── Neo4j (official neo4j/neo4j chart) ────────────────────────────────────────
neo4j:
  enabled: true
  config:
    server.bolt.advertised_address: ":443"
    server.http.advertised_address: ":443"
  neo4j:
    acceptLicenseAgreement: "yes"
    edition: community
    name: neo4j
    passwordFromSecret: neo4j-auth
    resources:
      cpu: "2"
      memory: 4Gi
  services:
    neo4j:
      enabled: false
  volumes:
    data:
      mode: dynamic
      dynamic:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 10Gi
        storageClassName: gp3-csi

# ── Schema bootstrap Job ──────────────────────────────────────────────────────
bootstrap:
  enabled: true
  waitFor:
    enabled: true
    timeoutSeconds: 300
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""

# ── Optional in-cluster vLLM via llm-service (OpenShift AI / KServe) ──────────
# Off by default. Requires Red Hat OpenShift AI (KServe CRDs) + GPU (or CPU
# device profile). When enabling, also point api/ingestion llm.baseUrl at the
# Service the chart creates, e.g.:
#   http://llama-3-2-3b-instruct-vllm/v1
# Pass HF token via --set llm-service.secret.hf_token=<token> (gated models).
llm-service:
  enabled: false
  device: gpu
  rawDeploymentMode: true
  secret:
    enabled: true
    hf_token: ""
  models:
    llama-3-2-3b-instruct:
      enabled: false
      device: gpu
    llama-3-1-8b-instruct:
      enabled: false
      device: gpu

# ── FastAPI API (Service name: general-sim-api, port 8000) ─────────────────────
api:
  enabled: true
  # OpenShift Route; disable on Kind / plain Kubernetes.
  route:
    enabled: true
  # Init container + lifespan retries: Postgres/Neo4j before serving traffic.
  waitFor:
    enabled: true
    timeoutSeconds: 300
    startupFailureThreshold: 60
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""
  llm:
    # Default: OpenAI. For in-cluster llm-service, e.g.:
    #   baseUrl: http://llama-3-2-3b-instruct-vllm/v1
    #   apiKey: unused
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    backend: "openai"
  enabledDomains: aviation

# ── Ingestion CronJob ─────────────────────────────────────────────────────────
ingestion:
  enabled: true
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""
  llm:
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    backend: "openai"
  enabledDomains: aviation
  adapterId: opensky_flights
